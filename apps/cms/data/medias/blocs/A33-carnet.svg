<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <rect width="1600" height="900" fill="#EFEBE3"/>
  <rect x="180" y="120" width="1240" height="700" fill="#FBFAF7" stroke="#1A1A1A" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="220" y="170" width="420" height="18" fill="#0E6F87"/>
  <text x="220" y="230" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1A1A1A">Carnet du col des Trois-Vents, double page — reconstitution</text>
  <text x="220" y="272" font-family="Georgia, serif" font-size="22" fill="#1A1A1A" opacity="0.65">Col des Trois-Vents, 1 512 metres — releve chaque matin a huit heures depuis 1996</text>
  <line x1="700" y1="300" x2="700" y2="745" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="3"/>
  <text x="236" y="322" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1A1A1A" opacity="0.5">Page de gauche — grille de releve</text>
  <text x="736" y="322" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1A1A1A" opacity="0.5">Page de droite — colonne d'observations</text>
  <line x1="236" y1="338" x2="680" y2="338" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="736" y1="338" x2="1380" y2="338" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="2"/>
  <text x="236" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.55">Date</text>
  <text x="372" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.55">Min</text>
  <text x="444" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.55">Max</text>
  <text x="516" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.55">Neige</text>
  <text x="604" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.55">Pluvio</text>
  <line x1="236" y1="394" x2="680" y2="394" stroke="#1A1A1A" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="236" y1="440" x2="680" y2="440" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="478" x2="680" y2="478" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="516" x2="680" y2="516" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="554" x2="680" y2="554" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="592" x2="680" y2="592" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="630" x2="680" y2="630" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="668" x2="680" y2="668" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="236" y1="706" x2="680" y2="706" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="360" y1="394" x2="360" y2="734" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="432" y1="394" x2="432" y2="734" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="504" y1="394" x2="504" y2="734" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="592" y1="394" x2="592" y2="734" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <text x="458" y="566" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.4">valeurs quotidiennes</text>
  <text x="458" y="594" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.4">non reproduites</text>
  <text x="736" y="386" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.9">2004</text>
  <text x="818" y="386" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.8">Abri deplace de quarante metres, haie ombrageante.</text>
  <text x="818" y="412" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">Double releve dix-huit mois, ecart +0,3 sur les</text>
  <text x="818" y="436" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">maxima ; serie anterieure corrigee.</text>
  <line x1="736" y1="452" x2="1380" y2="452" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <text x="736" y="476" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.9">2011</text>
  <text x="818" y="476" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.8">Changement d'observateur, lecture a 8 h 30.</text>
  <text x="818" y="502" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">Effet nul sur la moyenne annuelle.</text>
  <line x1="736" y1="542" x2="1380" y2="542" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <text x="736" y="566" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.9">2016</text>
  <text x="818" y="566" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.8">Thermometre a index remplace par une sonde.</text>
  <text x="818" y="592" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">Douze mois paralleles : biais froid de 0,2 sur</text>
  <text x="818" y="616" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">les minima.</text>
  <line x1="736" y1="632" x2="1380" y2="632" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <text x="736" y="656" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.9">—</text>
  <text x="818" y="656" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.8">Pluviometre manuel non chauffe, toute la periode.</text>
  <text x="818" y="682" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">Sous-capte la neige de 20 a 40 % : cumuls non</text>
  <text x="818" y="706" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.62">exploitables.</text>
  <line x1="220" y1="745" x2="1380" y2="745" stroke="#1A1A1A" stroke-opacity="0.4" stroke-width="3"/>
  <text x="236" y="776" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1A1A1A" opacity="0.75">Moyenne annuelle 4,2 degres sur 1996-2005, 5,6 sur 2016-2025 — jours de neige au sol 121 puis 103</text>
  <text x="236" y="806" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.5">214 jours manquants sur 10 958, laisses vides et jamais estimes</text>
</svg>
