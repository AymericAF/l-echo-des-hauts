# Plan de construction Nixpacks du site public — lu par l application Coolify `echo-site`,
# dont la `Base Directory` est `/apps/web` : c est ICI que Nixpacks cherche ce fichier,
# pas a la racine du depot.
#
# POURQUOI IL EXISTE : le gabarit des images Open Graph (§4.5) est un SVG rasterise par
# `sharp`. `sharp` embarque fontconfig, PAS de fontes. Et l image de base de Nixpacks
# n en porte AUCUNE — mesure le 2026-08-07 sur `ghcr.io/railwayapp/nixpacks:ubuntu-1745885067` :
#
#     fc-list | wc -l   ->  0
#     ls /usr/share/fonts -> le repertoire n existe pas
#
# Consequence exacte, et c est le mode d echec ou succes et echec rendent la meme sortie :
# le PNG est PRODUIT, au bon format, au bon poids — et vide de tout glyphe. Mesure de
# l encre de la bande de titre sur `og/fr/le-budget-2027-de-la-communaute-des-hauts.png` :
# **7,53** au build, **69,55** sur un poste pourvu de fontes.
#
# Les familles reelles nommees par la pile de `src/lib/seo/gabarit-og.ts` sont DejaVu et
# Liberation : les autres (Georgia, Times New Roman, Segoe UI, Roboto, Helvetica, Arial)
# sont des fontes de systemes de bureau, elles ne se declarent pas dans une image de
# construction. `tests/nixpacks-fontes.test.ts` verifie que chacune des deux piles se
# termine bien sur une famille couverte par un paquet declare ci-dessous.
#
# `fontconfig` n est pas redondant avec les paquets de fontes : il construit le cache que
# `sharp` interroge pour resoudre `font-family`. Poser les fichiers sans lui ne les rend
# pas trouvables.
#
# ~~NE PAS declarer `nixPkgs` ici sans le spread `'...'` : sans lui, la liste ecraserait les
# paquets detectes par le fournisseur Node, et le build perdrait node et npm.~~
#
# ── 2026-09-04 : LA LISTE EST DESORMAIS ECRITE A LA MAIN, ET SANS LE SPREAD ─────────────
#
# La consigne barree ci-dessus disait vrai sur le RISQUE — remplacer la liste, c est reprendre
# la charge de poser node — et faux sur le REMEDE : le spread reinjecte `npm-9_x`, et `npm-9_x`
# n existe PAS dans nixpkgs. Il vient d un OVERLAY, que le fournisseur Node ajoute de lui-meme :
#
#     "nixOverlays": ["https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz"]
#
# POURQUOI ON LE RETIRE. Le webhook Strapi `publish_to_coolify` code `&force=true` en dur dans
# son URL, et dans Coolify 4.3.6 `force_rebuild` commande DEUX choses a la fois : la
# desactivation de la deduplication d image — indispensable, le contenu vient de Strapi AU
# BUILD — et `--no-cache`. Sous `--no-cache` la couche `#8` (`RUN nix-env -if
# .nixpacks/nixpkgs-<sha>.nix`) est REJOUEE a chaque publication, et elle telechargeait DEUX
# archives GitHub. Mesure sur le regime courant : 35 builds forces, 35 executions de la couche,
# 70 sollicitations, 1 refus (~2,9 %) — le `429` du deploiement `522`, tombe sur l overlay :
#
#     #8  0.135 unpacking 'https://github.com/NixOS/nixpkgs/archive/23f9169c….tar.gz' …
#     #8 43.25 unpacking 'https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz' …
#     #8 55.17 warning: error: unable to download '…': HTTP error 429
#
# ⚠️ NE PAS TOUCHER AU FORCAGE POUR AUTANT. Il a ete retire le 2026-08-12 puis REMIS le
# 2026-08-13 (decisions `fae6cd9c` puis `b9b98998`) apres 18 heures pendant lesquelles publier
# ne mettait plus rien en ligne — et cette panne-la est SILENCIEUSE : `200`, ligne de
# deploiement creee, vert en 9 secondes, « Build step skipped ». On echangerait une panne
# bruyante rattrapee en une relance contre une panne muette.
#
# CE QUE LE RETRAIT COUTE ET RAPPORTE, mesure et non estime (banc du 2026-09-04, image
# `ghcr.io/railwayapp/nixpacks:ubuntu-1745885067`, archive nixpkgs `23f9169c…`) :
#
#     nodejs_22 SEUL           ->  node v22.19.0, npm 10.9.3      (l overlay est superflu)
#     npm ci, lockfile reel    ->  sortie 0, 172 entrees          (lockfileVersion 3)
#     sharp sous ce node       ->  0.35.3, PNG rasterise          (la raison d etre du fichier)
#
# ⚠️ ET CE QUE CE RETRAIT NE RAPPORTE PAS — la ligne a ne pas croire sur parole. L overlay
# coute 0,7 s (43,25 -> 43,94 dans le journal du build 591), pas les 109 s du `--no-cache`.
# Ces 109 s sont l archive NIXPKGS (43 s de depaquetage) et les 127 Mio tires de
# `cache.nixos.org` : le retrait de l overlay ne les touche pas. Ce qu il ferme est le
# RISQUE — une reference MUTABLE (`main`), retelechargee a chaque publication, sur une limite
# de debit anonyme partagee par IP — pas le temps de build.
#
# ⚠️ LA SECONDE SOLLICITATION RESTE, ET ELLE N EST PAS SUPPRIMABLE D ICI. L URL de nixpkgs est
# ecrite en dur dans le binaire nixpacks 1.41.0 (`coollabsio/coolify-helper:1.0.16`) ; seul le
# `<sha>` est parametrable :
#
#     $ strings /usr/local/bin/nixpacks | grep fetchTarball
#     import (fetchTarball "https://github.com/NixOS/nixpkgs/archive/.tar.gz")
#     (import (builtins.fetchTarball ""))        <- l overlay, lui, vient de `nixOverlays`
#
# Ne declarer AUCUN paquet nix ferait bien disparaitre la couche entiere (verifie : ni `COPY
# .nixpacks/*.nix` ni `RUN nix-env` dans le Dockerfile engendre) — mais l image de base ne
# porte NI node NI npm, aucun canal `<nixpkgs>`, et son Ubuntu 24.04 n offre que du node 18
# quand `engines.node` exige `>= 22.12.0`. Fermer cette seconde moitie suppose de CHANGER DE
# SUBSTRAT (image de build dediee, ou bascule sur le build pack Dockerfile) : ca ne vit plus
# a cote de ce fichier, et ca se decide.
#
# Verrouille par `tests/nixpacks-appels-github.test.ts`, qui juge les DECLARATIONS de ce
# fichier — pas le journal du build, qui reste la preuve terminale.

[phases.setup]
nixPkgs = ['nodejs_22']
nixOverlays = []
aptPkgs = ['fontconfig', 'fonts-dejavu-core', 'fonts-liberation']

# ~~LA SURCHARGE `partage.seo` SE PROUVE ICI, ET C EST LE SEUL ENDROIT QUI LE PERMET.~~
#
# 2026-08-14, 21h — CETTE PREMISSE EST FAUSSE, ET ELLE A CASSE LA PUBLICATION.
# Coolify construit `echo-site` avec `base_directory = /apps/web` (releve en base,
# `applications.base_directory`) : le contexte de construction ne contient PAS
# `apps/cms/data`. La preuve rend donc `2` -- « absent : /cms/data/articles » -- et
# comme elle echoue en ferme, le BUILD echoue avec elle.
#
# MESURE : le commit qui a ajoute la commande est date de 17h48 UTC ; le premier
# deploiement en echec est le 470 a 17h49, puis 474, 476 et 478. QUATRE de suite,
# plus de trois heures, et personne ne l a vu -- les runs qui poussaient ne
# regardaient pas le deploiement. Publier ne remettait plus le site en ligne.
#
# La commande est RETIREE ci-dessous (validation d Aymeric en session, 2026-08-14).
# Le fichier de la preuve n est PAS touche : il reste jouable par
# `npm run recette:surcharge-seo`. Ou elle doit vivre desormais est une DECISION
# ouverte -- tache `49e9fc1a`, qui porte les quatre options et le fait mesure.
#
# Le texte d origine est conserve ci-dessous, barre, parce qu il dit exactement ce
# qu on croyait vrai -- et c est ce qu il faut relire avant de la remettre.
#
# ~~[texte d origine]~~
#
# `scripts/preuve-surcharge-seo.mjs` croise DEUX sources reelles : le corpus versionne
# (`../cms/data`, ce que la REDACTION a ecrit) et le `dist/` construit. Elle est la seule
# preuve du depot qui confronte le HTML au contenu editorial — les autres verifient des
# invariants sans connaitre le contenu.
#
# Pourquoi PAS en integration continue (mesure du 2026-08-14, trois pushes rouges) : le
# job `sortie` construit contre le Strapi de SUBSTITUTION, qui sert 3 fixtures. Aucune
# page du corpus n y est, donc rien a confronter, donc code `2` — le BON verdict, sur un
# job qui n avait aucun moyen de faire mieux. Et il n existe aucun job de mesure ou la
# deplacer : aucun workflow des deux depots ne porte de secret ni ne joint l instance.
#
# Ici, les deux extremites existent en meme temps : Coolify clone le depot — donc le
# corpus — et construit contre l instance REELLE. Aucun banc a ecrire, et surtout aucun
# maillon remplace : la chaine prouvee reste `redaction -> seed -> Strapi -> build -> HTML`,
# celle qui a effectivement casse deux fois (le seed muet du 2026-08-12, le renommage des
# medias du 2026-08-14).
#
# CE QU IL EN COUTE, ET C EST VOULU : un manquement SEO fait echouer la construction, donc
# le deploiement — l ancienne version reste servie. C est deja le regime des huit gardes
# portees par les integrations d `astro.config.mjs`.
#
# `npm run build` DOIT rester declare : declarer `cmds` REMPLACE la commande detectee par
# le fournisseur Node. L omettre supprimerait la construction elle-meme, et la preuve
# jugerait le vide qu elle vient de causer. Verrouille par `tests/nixpacks-preuve-surcharge.test.ts`.
#
# ── 2026-08-18 : LA SONDE DE SCHEMA PASSE DEVANT LA CONSTRUCTION ────────────────────────
#
# POURQUOI. Un push qui touche `apps/cms` ET `apps/web` met les deux applications Coolify
# en file A LA MEME SECONDE (`concurrent_builds = 2` ; Coolify n offre AUCUNE dependance
# entre applications). Le site est un build STATIQUE : il interroge le Strapi de
# PRODUCTION pendant sa construction, avant que celui-ci ait fini de redemarrer avec le
# nouveau schema. Il demande alors un champ que l ANCIEN ne connait pas, recoit un
# `400 ValidationError`, et sort en 1. TROIS occurrences mesurees :
#
#     queue 455 (14/08, 3a8ad72)  Invalid key alternativeCouverture    ecart 189 s
#     queue 501 (17/08, dadef1d)  Invalid key alternativePartage       ecart  86 s
#     queue 506 (17/08, 3c7a2fc)  Invalid key alternatives at contenu  ecart 275 s
#
# `scripts/attendre-schema.mjs` rejoue LES REQUETES DECLAREES de `src/lib/strapi/requete.ts`
# et boucle jusqu a ce qu elles repondent — plafond 10 min (pire deploiement `echo-strapi`
# mesure : 547 s), une passe toutes les 5 s. Au plafond, elle echoue en NOMMANT le champ :
# c est le gain principal, un `400` illisible devenu un verdict qui dit ou chercher.
#
# ⚠️ ELLE EST UNE ENTREE DISTINCTE DE `npm run build`, ET CE N EST PAS DU STYLE. La cible
# de temps de build M-04 se mesure sur `astro build` (avenant A6, `docs/protocole-mesure.md`
# §1) : fondue dans le build — ou enchainee par `&&` dans la MEME entree de `cmds` —
# l attente du CMS entrerait dans le segment mesure. Les deux entrees, leur ordre et leur
# non-fusion sont verrouilles par `tests/nixpacks-preuve-surcharge.test.ts`.
#
# CE QU ELLE NE FERME PAS, et c est assume : elle RATTRAPE la course, elle ne la supprime
# pas. Si le deploiement du CMS echoue, elle consomme son plafond puis echoue — lisiblement.
# Le remede qui la supprimerait (sequencer les deux deploiements) est la piste 1 du dossier
# `docs/course-schema-cms-vs-build-site.md`, et il est explicitement recommande de NE PAS
# l engager tant que cette sonde n a pas consomme son plafond au moins une fois.
#
# ── 2026-08-19 : ELLE NE COUVRE QUE L INSTANT QUI LA PRECEDE ────────────────────────────
#
# Mesure (tache `d0e0df3b`, commit c951b25, queues 529 et 530) : la sonde a rendu « PRET a la
# premiere passe » a 08:03:46.41, et `npm run build` a echoue sur un `502` a 08:03:50.11,
# pendant que Traefik RETIRAIT l ancien conteneur CMS. Son plafond n avait pas ete effleure
# (0,9 s sur 600) : L ALLONGER N AURAIT RIEN CHANGE, et ce n est donc PAS le levier a toucher
# si la panne se represente.
#
# Ce qui couvre cet instant vit dans `src/lib/strapi/client.ts` : des REPRISES sur 502/503/504
# et sur l injoignable, plafonnees a dix minutes, premier reessai a 500 ms — verrouillees par
# `tests/client-reprises.test.ts`. Elles sont DANS le build et non devant lui, parce que
# l instant tombe APRES la sonde. Elles ne polluent pas la mesure M-04 : elles ne consomment
# du temps QUE si le CMS est injoignable pendant la construction, et une passe nominale ne les
# reveille jamais.
#
# ⚠️ CORRECTION DU 2026-08-20 — CE BLOC A DIT « QUATRE SECONDES ET DEMIE », ET C EST FAUX D UN
# FACTEUR SEPT. Le chiffre etait l ecart entre deux evenements d une seule queue, pas la
# largeur de la fenetre. Mesure sur 54 bascules (tache `a1d26d8e`) : la bascule dure 30,3 s en
# mediane (14,5 a 35,9 s, 54 sur 54), et pendant tout ce temps les DEUX conteneurs sont sains,
# portes par des etiquettes Traefik identiques, et repondent `200`. Les reprises ne s y
# declenchent donc JAMAIS — il n y a rien a reprendre. Elles couvrent le seul BORD : l instant
# du retrait de l ancien. Ce qui mord sur les trente secondes est l EMPREINTE
# (`apps/cms/src/middlewares/empreinte-commit.ts`), pas un reglage de delai.
#
# Cause de ces trente secondes, lue dans le journal : `health_check_start_period = 40` sur
# `echo-strapi` fait dormir Coolify 40 s avant sa premiere interrogation, quand Docker declare
# le conteneur sain des sa premiere sonde (~10 s). NE PAS allonger ce start-period : c est lui
# qui CREUSE la fenetre, pas lui qui la protege.
#
# ⚠️ `--experimental-strip-types` N EST PAS DECORATIF, ET SON ABSENCE CASSERAIT TOUT.
#
# La sonde importe `src/lib/strapi/requete.ts` — elle DOIT, c est la seule facon de rejouer
# les requetes du build plutot qu une copie qui divergera. Or c est le PREMIER processus
# `node` NU du build de production a charger un `.ts` : `npm run build` passe par Vite
# (`astro build`), et `scripts/index-pagefind.mjs` n importe que des `.mjs` — verifie sur
# tout le graphe d imports le 2026-08-18.
#
# Le retrait des types n est implicite qu a partir de Node 22.18. `package.json` declare
# `engines.node >= 22.12.0`, et l image de construction resout cette borne elle-meme : rien
# dans ce depot ne garantit qu elle rendra >= 22.18. Sous une version anterieure, la sonde
# ne PLANTERAIT PAS SUR LA COURSE — elle planterait au chargement, sur TOUS les
# deploiements, y compris ceux qui n ont aucune course a rattraper. Le remede aurait un pire
# mode d echec que le defaut ([[garde-en-ferme-dans-un-build-transforme-l-incapacite-en-panne]]).
#
# MESURE, en cassant, le 2026-08-18 sur Node v24.14.0 :
#   node --no-experimental-strip-types scripts/attendre-schema.mjs
#     -> ERR_UNKNOWN_FILE_EXTENSION « .ts » … client.ts, sortie 1
#   node --no-experimental-strip-types --experimental-strip-types scripts/attendre-schema.mjs
#     -> « schema PRET a la premiere passe », sortie 0
# Le drapeau existe depuis Node 22.6 et reste ACCEPTE en 24 (ou il ne fait plus rien) : il
# couvre donc toute la plage declaree par `engines`. Verrouille par
# `tests/nixpacks-preuve-surcharge.test.ts`, qui l exige tant que la sonde importe un `.ts`.
# ── 2026-08-19 : ELLE DIT DESORMAIS QUELLE VERSION LUI A REPONDU ───────────────────────
#
# Un `200` de la sonde ne disait rien du CONTENEUR qui l avait rendu. Le CMS pose desormais
# `X-Echo-Commit` (`apps/cms/src/middlewares/empreinte-commit.ts`, depuis `SOURCE_COMMIT` que
# Coolify injecte deja dans le conteneur applicatif), et la sonde LIT cet en-tete a chaque
# passe. Le journal de ce build porte donc une ligne « empreinte du CMS, passe N : … » — c est
# la seule trace qui permette, APRES COUP, de distinguer « le build a lu le NOUVEAU CMS » de
# « il a lu l ancien, et personne ne l a su ».
#
# ⚠️ ELLE N EN FAIT RIEN DE BLOQUANT, ET IL NE FAUT PAS « FINIR LE TRAVAIL ». Les deux
# applications ne portent le meme SHA que sur un push touchant LES DEUX arbres : `watch_paths`
# ne reveille le CMS que sur `apps/cms/**` et le site que sur `apps/web/**`, si bien que le CMS
# tourne couramment sur un commit plus recent que le site — c est LEGITIME. Une garde d egalite
# stricte planterait sur TOUS les deploiements ne touchant que le site : exactement le mode
# d echec que la note sur `--experimental-strip-types` ci-dessus documente, une incapacite
# transformee en panne. Empreinte absente, vide, divergente ou inegale = avertissement, et la
# sonde retombe sur son comportement d avant. Verrouille par la section 8 de
# `tests/attendre-schema.test.ts`.
#
# ET SURTOUT PAS EN MULTIPLIANT LES PASSES : sans identification de version, N passes vertes
# sur l ancien conteneur restent N mensonges. Le plafond et l intervalle ne sont pas le levier.
#
# CE QUI RESTE OUVERT — le SECOND TEMPS, hors perimetre de ce lot. Le build ignore sa PROPRE
# empreinte : `include_source_commit_in_build` vaut `false` sur les trois applications (releve
# en base le 2026-08-19), et Coolify efface `.git` avant de construire. La sonde tourne donc en
# mode DEGRADE, et elle le DIT. Le reglage se bascule dans Coolify, application `echo-site`,
# onglet Advanced, liste « Source commit availability » : « Runtime only (preserves cache) »
# -> « Available during build ». Son prix est ecrit par Coolify lui-meme
# (`app/Jobs/ApplicationDeploymentJob.php`) : « SOURCE_COMMIT changes with each commit and
# breaks Docker cache if included in build ». Il doit etre mesure contre la cible M-04 avant
# d etre engage.
# ── 2026-08-20 : LE BUILD, LUI, REFUSE DESORMAIS D AVOIR LU DEUX EMPREINTES ─────────────
#
# Ce qui precede reste vrai MOT POUR MOT de la SONDE : elle lit l empreinte, elle la journalise,
# elle ne bloque rien. Ce qui change est en aval, dans `npm run build`, et c est un AUTRE endroit
# pour une AUTRE raison — decision `982567fa`, approuvee le 2026-08-20 (branche B de « A puis B »).
#
# LA REGLE, ET ELLE N EST PAS NEGOCIABLE : zero empreinte vue vaut « je ne sais pas » et n echoue
# JAMAIS ; seules DEUX empreintes DISTINCTES pendant une meme construction font refuser. Elle vit
# dans `src/lib/strapi/empreintes.ts`, cablee sur `tenter()` de `src/lib/strapi/client.ts` — le
# point de passage UNIQUE de tous les appels du build au CMS. Prouvee en la cassant dans les
# QUATRE sens par `tests/garde-empreintes.test.ts`, temoin compris.
#
# ⚠️ CE N EST PAS L EGALITE STRICTE QUE LES DEUX BLOCS CI-DESSUS INTERDISENT, et la distinction
# est tout le sujet. Comparer l empreinte du CMS a celle du SITE planterait tous les deploiements
# ne touchant qu un seul arbre (`watch_paths`), et reste de toute facon IMPOSSIBLE : le build
# ignore la sienne. Ce qui est compare ici, ce sont les reponses d UNE MEME construction ENTRE
# ELLES. Un changement en cours de route n est pas une incapacite, c est un FAIT.
#
# POURQUOI PAS DANS LA SONDE, ET SURTOUT PAS DANS LE HEALTHCHECK. La sonde rend la main a sa
# premiere passe (~1 s) quand la construction s execute APRES, pendant 2 a 30 s : elle ne REGARDE
# PAS la ou le fait se produit, et aucun plafond ne l y amenerait. Quant au `HEALTHCHECK` du
# Dockerfile d `apps/cms`, un echec y ferait rouler Coolify en arriere sur un conteneur
# parfaitement sain.
#
# MODE D ECHEC ASSUME : refuser une construction qui n avait rien compose (push croise, CMS
# redeploye pendant que le site construit). Le prix est UN REDEPLOIEMENT, contre une erreur
# inverse qui, elle, est SILENCIEUSE. Sur 199 constructions mesurees en dix-sept jours, TROIS ont
# chevauche une fenetre.
# ── 2026-08-21 : POURQUOI LE SITE N A PAS SON EMPREINTE, ET CE QUE COUTE LE REGLAGE ──────
#
# LE BLOC « CE QUI RESTE OUVERT » CI-DESSUS DIT VRAI SUR LE FAIT ET FAUX SUR LE PRIX. Le fait
# tient : le build ignore sa propre empreinte. Le prix, lui, etait REPRIS de Coolify sans avoir
# ete mesure ici — il est NUL sur cette application, et la mesure est plus bas.
#
# LE MECANISME, releve dans le source de Coolify (`app/Jobs/ApplicationDeploymentJob.php`) et non
# suppose. `generate_coolify_env_variables($forBuildTime)` injecte `SOURCE_COMMIT` sous la
# condition `! $forBuildTime || $settings->include_source_commit_in_build` :
#
#     AU RUNTIME  ->  toujours, sans condition ni reglage
#     AU BUILD    ->  seulement si le reglage vaut `true`
#
# ⚠️ CE N EST DONC PAS UN REGLAGE OUBLIE SUR UNE APPLICATION. Il vaut `false` sur les CINQ
# applications de l instance, `echo-strapi` COMPRIS (releve en base le 2026-08-21) : le basculer
# sur le CMS ne changerait rien, il n en a pas besoin. L asymetrie est celle du MOMENT D EXECUTION.
# `echo-strapi` est un conteneur Node vivant (`build_pack=dockerfile`, `is_static=f`) : son
# middleware lit la variable A L EXECUTION, la ou Coolify la donne toujours. `echo-site` est un
# site STATIQUE (`build_pack=nixpacks`, `is_static=t`) servi par nginx : son code ne s execute
# A AUCUN AUTRE MOMENT que la construction — exactement l instant ou Coolify la retient.
#
# AUCUN CONTOURNEMENT DANS LE DEPOT, verifie et non suppose : `cleanup_git()` est appele JUSTE
# AVANT `generate_nixpacks_confs()` (lignes 955-956), donc `.git` a disparu quand nixpacks demarre ;
# et les seules variables exposees au build nixpacks sont `COOLIFY_BRANCH`, `COOLIFY_FQDN`,
# `COOLIFY_URL` et `COOLIFY_RESOURCE_UUID` — releve dans le plan du build 550, aucune ne porte de
# commit. Le reglage est le SEUL levier.
#
# ⚠️ NE JAMAIS POSER UNE VARIABLE `SOURCE_COMMIT` A LA MAIN pour contourner. Coolify ne l injecte
# que `if ($this->application->environment_variables->where('key','SOURCE_COMMIT')->isEmpty())` :
# une variable manuelle EMPECHERAIT la vraie et figerait le build sur un SHA perime. Un mensonge
# stable est pire que l ignorance avouee.
#
# LE PRIX, MESURE SUR LE BUILD 550 (production, commit 6817c51) plutot que cite. Le Dockerfile que
# nixpacks engendre place la ligne `ARG …` / `ENV …` — ou `SOURCE_COMMIT` viendrait s ajouter —
# APRES l image de base, `nix-env` et `apt-get`, et AVANT `COPY . /app/.`. Or ce `COPY` est deja
# invalide a chaque commit, puisque le contexte de construction EST `apps/web`. Releve du build :
#
#     #6  WORKDIR                        CACHED     <- au-DESSUS de la ligne ENV : intact
#     #7  RUN nix-env                    CACHED     <- idem
#     #8  COPY .nixpacks/*.nix           CACHED     <- idem
#     #9  RUN apt-get install (fontes)   CACHED     <- idem
#     #10 COPY . /app/.                  DONE 0.1s  <- deja recalcule AUJOURD HUI
#     #11 npm ci                         DONE 6.0s  <- deja recalcule AUJOURD HUI
#     #14 npm run build                  DONE 12.5s <- le segment de la cible M-04
#
# Les quatre couches couteuses sont AU-DESSUS de la ligne ENV et le resteraient ; tout ce que
# `SOURCE_COMMIT` invaliderait est deja invalide par le `COPY`. SURCOUT MESURE : ZERO sur un
# deploiement comme celui-ci. Le seul cas residuel est le deploiement d un commit NOUVEAU dont le
# contexte `apps/web` n aurait pas bouge — que `watch_paths = apps/web/**` rend deja rare — et il
# coute UN `npm ci`, soit 6,0 s, monte de cache (`--mount=type=cache … /root/.npm`), sans
# telechargement. La cible M-04 se mesure sur `astro build` (#14), que le reglage ne touche pas.
#
# CE QUI RESTE A FAIRE, ET QUI N EST PAS DANS CE DEPOT : cocher, dans l INTERFACE Coolify (pas en
# SQL), application `echo-site` -> onglet Advanced -> liste « Source commit availability », la
# valeur « Available during build » a la place de « Runtime only (preserves cache) ». Rien d autre.
# Le code, lui, est PRET : `empreinteDuBuild()` lit la variable, et la sonde ECRIT desormais une
# ligne « empreinte du BUILD (site) : <sha> » des qu elle la connait — sans quoi la disparition de
# l avertissement DEGRADE serait la seule trace du succes, et se confondrait avec la suppression
# de la ligne. Les deux sens sont prouves par `tests/attendre-schema.test.ts` (8 undecies a
# 8 terdecies), et le VERROU de `8 nonies` continue d interdire qu une empreinte fasse ECHOUER
# quoi que ce soit.
[phases.build]
cmds = ['node --experimental-strip-types scripts/attendre-schema.mjs', 'npm run build']
