# Le filet increvable des gardes du code.
#
# Le crochet local (.githooks/commit-msg) est immediat mais il a TROIS trous
# assumes : il se contourne d'un `--no-verify`, il est ABSENT d'un clone frais
# tant que `core.hooksPath = .githooks` n'y a pas ete pose a la main, et son
# ciblage par graphe d'imports ne voit pas un fichier qu'aucun test n'atteint.
# Ce workflow ferme les trois : il tourne chez GitHub, sur ce que le depot porte
# reellement, sans dependre du poste ni d'un reglage local.
#
# IL LANCE TOUT, DELIBEREMENT. Le ciblage a un sens dans le crochet, ou il
# achete la latence d'un commit ; ici il n'achete rien et coute une garantie :
# un commit passe en `--no-verify`, ou un `git push` de plusieurs commits,
# laisserait une regression dans un test que le DERNIER commit n'a pas
# declenche. La ou le crochet demande « qu'est-ce qui a bouge ? »,
# l'integration demande « est-ce que tout passe encore ? ».
#
# DEUX ETAGES DE VERIFICATION, ET ILS NE SE REMPLACENT PAS.
#
#   - `tests` juge des ARBORESCENCES FABRIQUEES. Il prouve qu'une fonction se
#     comporte bien sur des donnees construites pour l'occasion. Il ne prouve
#     RIEN sur le site reellement produit : `inlineStylesheets` peut repasser a
#     `'auto'`, une integration peut sortir d'`astro.config.mjs`, un composant
#     peut cesser d'ecrire ses dimensions — les 566 tests restent VERTS.
#   - `sortie` juge la SORTIE D'UN BUILD REEL. C'est le seul etage qui voie ce
#     que le lecteur verrait.
#
# ~~CETTE DERNIERE PHRASE A ETE FAUSSE DU 2026-08-10 AU 2026-08-11~~, et c'est
# la forme d'erreur la plus chere : une affirmation fausse dans un commentaire
# fait qu'on ne regarde plus. Depuis la fusion 1bbb1b8, `npm run build` vaut
# `astro build && node scripts/index-pagefind.mjs` — Pagefind indexe la sortie
# PUIS la re-inspecte, ce qui etend la garde T-09 aux octets ecrits APRES
# `astro build`, le seul endroit du site qui echappait a son regard. Or
# `preuve-rendu.mjs` lancait `npx astro build` : l'etage s'arretait au PREMIER
# maillon. Mesure du 2026-08-11 : apres `npm run preuve:rendu`, `dist/pagefind/`
# N'EXISTAIT PAS, et la ligne « N page(s) indexee(s) par Pagefind » n'apparaissait
# QUE dans le journal du deploiement Coolify. **2026-08-11 (tache 08f04f58) :
# `preuve-rendu.mjs` construit desormais par `npm run build`**, la porte meme de
# la production — cout mesure de l'indexation sur les fixtures (24 pages) :
# 0,25 s a chaud, 1,3 s a froid, contre 3,3 s pour le build seul. L'argument
# « preuve:rendu doit rester rapide » ne tenait pas devant la mesure.
#
# CE QUE CE COMMENTAIRE A AFFIRME DE FAUX JUSQU'AU 2026-08-10, et qui a laisse
# l'etage `sortie` inexistant : « les scripts verifier-* et preuve-* sortent sur
# le reseau (site servi, instance Strapi) ». MESURE : sur les neuf scripts,
# `fetch` n'apparait qu'une fois dans tout `apps/web/scripts` et
# `apps/web/integrations` — `medias-locaux.mjs`, qui telecharge les medias
# DEPUIS L'URL QU'ON LUI DONNE. Les six `verifier-*` lisent un repertoire sur
# disque et rien d'autre ; les trois `preuve-*` lancent un `astro build` contre
# un Strapi de substitution servi en 127.0.0.1 (`scripts/serveur-fixtures.mjs`,
# corpus embarque de `scripts/corpus-recette.mjs`). AUCUN ne sort de la machine,
# AUCUN n'a besoin d'infrastructure. La phrase decrivait une crainte, pas le
# code — et un dispositif absent parce qu'on l'a cru impossible coute plus cher
# qu'un dispositif rouge, parce que personne ne va verifier une absence.
#
# (MESURE DATEE, CONSERVEE TELLE QUELLE — elle portait sur les six `verifier-*`
# d'alors, et la reecrire ferait mentir la mesure. Ils sont NEUF depuis le
# 2026-08-11 : SEPT lisent `dist/` sur disque, et DEUX mesurent une reponse HTTP
# — `verifier-en-tetes` celle de la production, `verifier-surface-publique`
# celle de l'instance Strapi. Ces deux-la sont les exemptes du pas
# « verificateurs de sortie » ci-dessous ; ils sont NOMMES ET JUSTIFIES dans
# `apps/web/scripts/verificateurs-de-sortie.mjs`, et le pas imprime leur raison
# a chaque execution. Le nombre reel ne s'ecrit plus nulle part : il se derive
# de `package.json`.)
#
# CE QUI RESTE HORS DE PORTEE D'ICI, pour de vrai : tout ce qui se lit sur la
# REPONSE SERVIE — en-tetes et CSP, compression et version HTTP negociees,
# certificat, campagnes Lighthouse et inventaire reseau. Rien de cela n'est un
# script de ce depot : ce sont les mesures M-01 a M-07 du protocole, elles
# vivent dans le depot prive et restent en recette (P3), sur l'environnement en
# ligne. L'integration continue n'a pas de site a interroger, et ne pretend pas
# en avoir un.
#
# POURQUOI PAS DANS LE CROCHET LOCAL. Mesure du 2026-08-10 (poste Windows) : le
# build sur fixtures coute 3,3 s (17 pages), celui du corpus de recette 4,9 s
# (52 pages), quand le crochet entier coute aujourd'hui 0,2 a 3,0 s. Un crochet
# qui coute plusieurs secondes se fait contourner en une semaine — et on perd
# alors AUSSI ce qui marchait. Les verificateurs eux-memes ne sont pas le sujet :
# ils coutent ~105 ms a eux six. C'est le BUILD qui coute, et il n'a pas sa place
# dans un `git commit`.
#
# Cout mesure des suites de tests reunies : ~3,0 s de calcul a chaud. La minute
# de runner part en `npm ci`, pas en verification.
#
# LES PAS DU JOB `sortie` NE SONT PLUS EN SERIE (2026-08-12, tache 772ac0ac).
# GitHub Actions arrete un job au PREMIER pas non nul : un verificateur rouge
# faisait sauter `preuve:pagination` et `preuve:encre-og`, qui ne partagent
# pourtant rien avec lui — la premiere construit son propre corpus dans
# `dist-recette/`, la seconde ne lit aucune sortie. Les pas sautes ne sont ni
# verts ni rouges : ils N'EXISTENT PAS dans le run, et tant qu'un rouge subsiste
# on n'a aucun moyen de savoir si les gardes d'apres tournent encore. Chaque pas
# qui juge tourne desormais sous `if: always()`, CONSIGNE son code de sortie
# (`apps/web/scripts/journal-des-preuves.mjs`) et sort en 0 ; le dernier pas
# relit le journal et rend le verdict unique. Le rouge n'est pas perdu, il est
# DIFFERE — et un journal vide, illisible ou ampute rend 2, jamais 0.

name: Gardes du code

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  declenchement:
    name: Le declenchement local est versionne, executable et branche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Le crochet est en 100755 dans l index, et il appelle son declencheur
        # Un crochet en 100644 est saute EN SILENCE hors Windows : le depot
        # paraitrait garde et ne le serait pas. Et un crochet qui n'appelle plus
        # son declencheur est une coquille. Les deux se lisent dans l'index,
        # donc depuis un clone frais — le seul point de vue qui ne ment pas.
        run: |
          mode="$(git ls-files -s .githooks/commit-msg | cut -d' ' -f1)"
          if [ "$mode" != "100755" ]; then
            echo "ROUGE : .githooks/commit-msg absent de l index ou non executable (mode='$mode')"
            exit 1
          fi
          git show :.githooks/commit-msg | grep -q 'outils/gardes-au-commit.js' || {
            echo "ROUGE : .githooks/commit-msg n appelle plus outils/gardes-au-commit.js"
            exit 1
          }
          echo "OK : .githooks/commit-msg 100755, et il appelle outils/gardes-au-commit.js"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Le declencheur lui-meme se lance sans erreur
        # Sur un arbre ou rien n'est indexe, il doit rendre 0 en n'ayant rien
        # lance. Un declencheur qui plante ici plante a chaque commit.
        #
        # CE PAS EST AUSSI UNE MESURE (2026-08-11) : appele a la main, hors de
        # tout commit, le declencheur ne doit RIEN lancer. Depuis qu'un index
        # sans rien de neuf ne vaut plus « rien a faire » — c'etait le trou de
        # l'amendement — il faut qu'il distingue « pas de commit en cours » d'un
        # amendement, sans quoi ce job lancerait des tests SANS `npm ci` et
        # rougirait pour une cause qui n'est pas la sienne.
        run: node outils/gardes-au-commit.js

      - name: Le crochet AVANT PUSH est versionne, executable, et branche sur son module
        # Meme raison que pour `commit-msg`, et meme point de vue : l'index, donc
        # depuis un clone frais. Ce crochet-la garde `main` d'un resultat de FUSION
        # rouge — 17 des 20 dernieres fusions de ce depot sont des merges LOCAUX
        # pousses, et le job ne les jugeait donc qu'une fois DEJA sur main.
        run: |
          mode="$(git ls-files -s .githooks/pre-push | cut -d' ' -f1)"
          if [ "$mode" != "100755" ]; then
            echo "ROUGE : .githooks/pre-push absent de l index ou non executable (mode='$mode')"
            exit 1
          fi
          git show :.githooks/pre-push | grep -q 'gardes-avant-push.js' || {
            echo "ROUGE : .githooks/pre-push n appelle plus gardes-avant-push.js"
            exit 1
          }
          echo "OK : .githooks/pre-push 100755, et il appelle gardes-avant-push.js"

      - name: La recette de la garde avant push — vrais depots, vrais push, refus exiges
        # 7 cas : le nominal, une suite rouge qui ARRETE le push, le refus qui nomme
        # les applications, une branche autre que main qu'on ne juge pas, et les deux
        # incapacites (arbre sale, HEAD different du commit pousse) qui refusent
        # plutot que de juger a cote.
        run: node .githooks/gardes-avant-push.recette.mjs

      - name: La recette du declencheur — elle le prouve en le cassant, dans les deux sens
        # 14 cas, depots jetables, vrais `git commit`. Elle tient les deux
        # moities de la garde, et la seconde protege l'adoption autant que la
        # premiere : un amendement qui porte un contenu jamais juge est REFUSE,
        # et un amendement qui ne corrige qu'un message ne lance RIEN.
        run: node outils/gardes-au-commit.recette.mjs

      - name: La recette du retrait de worktree REFUSE de se declarer conforme sur ubuntu
        # Elle ne peut pas tourner ici : son objet est une jonction NTFS, qui n existe
        # que sur Windows — et le job tourne sur ubuntu-latest. Ce pas n exerce donc pas
        # le retrait ; il exerce la GARDE DE PLATEFORME de la recette.
        #
        # Pourquoi ce pas existe quand meme. Une recette dont l objet est absent de la
        # plateforme est a un cheveu de passer au vert en ne testant RIEN — 0 cas joues,
        # 0 echec, code 0 — soit exactement la forme d echec que ce depot traque : une
        # incapacite qui rend la meme sortie qu un succes. La recette sort donc en code 2
        # (« non jouee »), distinct de 0 (conforme) et de 1 (echec), et ce pas verifie
        # qu elle le fait vraiment. Le jour ou quelqu un « simplifierait » cette sortie
        # en code 0, la CI le dirait ici.
        #
        # La preuve reelle du retrait, elle, est LOCALE (machine Windows). Cette limite
        # est assumee et ecrite : la CI ne la porte pas.
        run: |
          set +e
          sortie="$(node outils/retirer-worktree.recette.mjs 2>&1)"
          code=$?
          echo "$sortie"
          if [ "$code" != "2" ]; then
            echo "ROUGE : attendu le code 2 (non jouee) sur $(uname -s), obtenu $code"
            exit 1
          fi
          # `NON JOU` et pas `NON JOUÉE` : un accent qui traverse mal un encodage
          # rendrait ce pas rouge pour une raison qui n a rien a voir avec la garde.
          echo "$sortie" | grep -q 'NON JOU' || {
            echo "ROUGE : le code 2 est rendu, mais la sortie ne DIT pas qu elle n a rien prouve"
            exit 1
          }
          echo "OK : hors Windows, la recette refuse de se declarer conforme, et le dit."

      - name: Les recettes des liens de worktree REFUSENT de se declarer conformes sur ubuntu
        # MEME CONTRAINTE, MEME MOTIF que le pas precedent, pour les deux recettes ajoutees
        # avec la garde « aucune jonction dans les worktrees » :
        #   - outils/liens-worktrees.recette.mjs  (la garde qui CONSTATE et refuse)
        #   - outils/creer-worktree.recette.mjs   (le confort qui pose des `mklink /D`)
        #
        # Leur objet est une jonction NTFS, qui n existe QUE sur Windows ; ce job tourne sur
        # ubuntu-latest. Elles sont donc a un cheveu de passer au vert en ne testant RIEN —
        # 0 cas joues, 0 echec, code 0 — soit exactement la forme d echec que ce depot
        # traque : une incapacite qui rend la meme sortie qu un succes. Elles sortent en
        # code 2 (« non jouee »), DISTINCT de 0 (conforme) et de 1 (echec), et ce pas
        # verifie qu elles le font vraiment. Le jour ou quelqu un « simplifierait » cette
        # sortie en code 0, la CI le dirait ici — et pas le jour ou un `git worktree remove`
        # viderait `apps/*/node_modules`.
        #
        # La preuve reelle est LOCALE (machine Windows) : 9 cas verts pour chacune, dont la
        # pose d une VRAIE jonction verifiee par `dir /AL` avant tout verdict. Cette limite
        # est assumee et ecrite ; la CI ne la porte pas.
        run: |
          set +e
          # PAS DE BOUCLE `for … in <liste>` ICI, ET CE N EST PAS UN DETAIL DE STYLE : un
          # test d apps/web (`integration-continue.test.ts`) refuse toute liste de sujets
          # ecrite en dur dans ce workflow — c est par une telle liste que `cascade-titres`
          # etait reste dehors. Les deux recettes sont donc NOMMEES, un appel chacune, comme
          # le pas precedent le fait pour la sienne. Cette regle a rougi sur ce pas pendant
          # qu on l ecrivait : elle fonctionne.
          verifier_non_jouee() {
            sortie="$(node "$1" 2>&1)"
            code=$?
            echo "--- $1 (code $code)"
            echo "$sortie"
            if [ "$code" != "2" ]; then
              echo "ROUGE : $1 — attendu le code 2 (non jouee) sur $(uname -s), obtenu $code"
              return 1
            fi
            # `NON JOU` et pas `NON JOUÉE` : un accent qui traverse mal un encodage
            # rendrait ce pas rouge pour une raison qui n a rien a voir avec la garde.
            case "$sortie" in
              *"NON JOU"*) return 0 ;;
            esac
            echo "ROUGE : $1 — code 2 rendu, mais la sortie ne DIT pas qu elle n a rien prouve"
            return 1
          }
          echec=0
          verifier_non_jouee outils/liens-worktrees.recette.mjs || echec=1
          verifier_non_jouee outils/creer-worktree.recette.mjs || echec=1
          [ "$echec" = 0 ] || exit 1
          echo "OK : hors Windows, les deux recettes refusent de se declarer conformes, et le disent."

      - name: La garde des liens de worktree se lance, et DIT qu elle ne juge rien ici
        # La garde elle-meme n est pas une recette : sur ubuntu, « aucune jonction » est un
        # fait VRAI (la jonction NTFS n y existe pas), pas une incapacite — elle rend donc 0.
        # Ce pas verifie deux choses qu on perdrait sans lui : qu elle se lance sans erreur
        # (une garde qui plante au demarrage ne garde rien), et qu elle ECRIT que le defaut
        # ne peut pas se produire ici, au lieu de rendre le silence d un travail fait.
        run: |
          set +e
          sortie="$(node outils/liens-worktrees.js 2>&1)"
          code=$?
          echo "$sortie"
          if [ "$code" != "0" ]; then
            echo "ROUGE : attendu 0 sur $(uname -s) (aucune jonction possible), obtenu $code"
            exit 1
          fi
          # `NTFS` et pas « rien a juger » : le marqueur cherche est SANS ACCENT, pour la
          # meme raison que le `NON JOU` du pas precedent — un accent qui traverse mal un
          # encodage rendrait ce pas rouge pour une cause etrangere a la garde.
          case "$sortie" in
            *NTFS*) ;;
            *)
              echo "ROUGE : la garde rend 0 sans DIRE que le defaut ne peut pas se produire ici"
              exit 1
              ;;
          esac
          echo "OK : la garde se lance, rend 0, et dit pourquoi elle ne juge rien."

      - name: Aucun fichier de test n est absent du `npm test` de son application
        # Le `test` de package.json ENUMERE les fichiers. Un test ajoute dans
        # tests/ mais oublie dans cette liste ne tournerait NULLE PART — ni au
        # crochet, ni ici. C'est le trou que ce pas ferme, et il ne se voit
        # autrement qu'en comptant a la main.
        run: |
          node -e '
            const fs = require("fs");
            let rouge = false;
            for (const app of ["apps/web", "apps/cms"]) {
              const pkg = JSON.parse(fs.readFileSync(app + "/package.json", "utf8"));
              const listes = new Set(pkg.scripts.test.match(/tests\/[A-Za-z0-9._-]+\.test\.ts/g) || []);
              const presents = fs.readdirSync(app + "/tests")
                .filter((f) => f.endsWith(".test.ts"))
                .map((f) => "tests/" + f);
              const manquants = presents.filter((f) => !listes.has(f));
              const fantomes = [...listes].filter((f) => !presents.includes(f));
              if (manquants.length) { rouge = true; console.log("ROUGE " + app + " : absent du npm test -> " + manquants.join(", ")); }
              if (fantomes.length) { rouge = true; console.log("ROUGE " + app + " : liste mais inexistant -> " + fantomes.join(", ")); }
              if (!manquants.length && !fantomes.length) console.log("OK " + app + " : " + presents.length + " tests, tous lances par npm test");
            }
            process.exit(rouge ? 1 : 0);
          '

  tests:
    name: ${{ matrix.app }} — la suite complete
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/web, apps/cms]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: npm test
        working-directory: ${{ matrix.app }}
        run: npm test

  sortie:
    name: La sortie construite — un build reel, puis les verificateurs derives
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # LE JOURNAL DES PREUVES, ET POURQUOI IL EXISTE (2026-08-12, tache 772ac0ac).
      #
      # Ce job enchaine CINQ pas qui JUGENT, sur des objets SANS RAPPORT entre eux :
      # `preuve:pagination` construit son propre corpus dans `dist-recette/`,
      # `preuve:encre-og` ne lit meme aucune sortie. Or GitHub Actions arrete un job au
      # PREMIER pas en code non nul : un verificateur rouge faisait donc SAUTER les deux
      # preuves suivantes, qui ne devenaient ni vertes ni rouges — elles n existaient plus
      # dans le run. On corrigeait une trouvaille, on repoussait, et le run d apres
      # decouvrait la suivante : un defaut par aller-retour de CI, a `npm ci` + deux builds
      # piece. Et tant qu un pas rougissait, on n avait AUCUN moyen de savoir si les gardes
      # d apres tournaient encore.
      #
      # DESORMAIS : chaque pas qui juge tourne sous `if: always()`, CONSIGNE son code de
      # sortie dans ce journal, et sort en 0 — le rouge n est pas perdu, il est DIFFERE.
      # Le dernier pas relit le journal et rend le verdict unique du job.
      #
      # PAS `continue-on-error: true` : il fait passer la CONCLUSION du pas a `success`,
      # ce qui echangerait un court-circuit contre un mensonge.
      JOURNAL_DES_PREUVES: ${{ github.workspace }}/.journal-des-preuves
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Les fontes de l image de construction, ici aussi
        # `sharp` embarque fontconfig et AUCUNE fonte. Sans fontes, le gabarit OG
        # rasterise un PNG au bon format, au bon poids, et VIDE de tout glyphe —
        # succes et echec rendent la meme sortie. C'est exactement ce que
        # `nixpacks.toml` corrige pour l'image Coolify ; le runner doit porter les
        # MEMES paquets, sinon `garde-seo` rougirait ici pour une cause qui
        # n'existe pas en production, et on la desactiverait.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-dejavu-core fonts-liberation
          echo "fc-list : $(fc-list | wc -l) fonte(s)"

      - name: npm ci
        id: installation
        run: npm ci --no-audit --no-fund

      - name: Build reel sur fixtures, et les 8 types de blocs rendus
        id: preuve-rendu
        # `if: always() && …` — le pas ne depend plus de ceux d avant, mais il depend
        # encore de `npm ci` : juger sans `node_modules` ne produirait que des incapacites
        # en cascade, c est-a-dire du bruit qui ferait desactiver le journal.
        if: always() && steps.installation.outcome == 'success'
        # `preuve:rendu` lance `npm run build` COMPLET contre le Strapi de
        # substitution — donc `astro build` PUIS `scripts/index-pagefind.mjs`,
        # la porte MEME de la production (2026-08-11, tache 08f04f58 ; il
        # s'arretait avant au premier maillon, cf. l'en-tete de ce fichier).
        # Les huit integrations d'`astro.config.mjs` s'exercent DANS ce build et
        # le font sortir en code non nul, et l'indexation re-inspecte la sortie
        # AUGMENTEE : c'est ici que la sortie est jugee pour de bon.
        #
        # `code=0` puis `… || code=$?` et non `…; code=$?` : le shell d'un `run:` est
        # `bash -e {0}`, et la seconde forme AVORTERAIT le pas avant l'affectation.
        run: |
          code=0
          npm run preuve:rendu || code=$?
          node scripts/journal-des-preuves.mjs --consigner preuve:rendu "$code"

      - name: La sortie construite porte bien l index de recherche
        id: index-de-recherche
        if: always() && steps.installation.outcome == 'success'
        # MECANIQUE, ET PAS CONVENTIONNELLE. Revenir a `npx astro build` dans
        # `preuve-rendu.mjs` ferait rougir `tests/integration-continue.test.ts` —
        # mais un test se contourne, et le job resterait VERT sur une sortie sans
        # index, exactement l'etat du 2026-08-11. Ce pas-la lit le repertoire
        # PRODUIT : il ne peut pas etre satisfait par une declaration.
        #
        # TROIS ISSUES ET NON DEUX, depuis que ce pas peut tourner APRES un
        # `preuve:rendu` rouge (2026-08-12) : `dist/` absent veut dire que le build
        # n'a rien produit — c'est une INCAPACITE (code 2, corriger l'ENVIRONNEMENT),
        # pas un index manquant. Les confondre enverrait chercher un defaut
        # d'indexation la ou il n'y a pas eu de construction du tout.
        run: |
          code=0
          if [ ! -d dist ]; then
            echo "INCAPACITE : dist/ n existe pas — aucune sortie construite, il n y a rien a juger ici"
            code=2
          elif [ ! -f dist/pagefind/pagefind.js ]; then
            echo "ROUGE : dist/pagefind/pagefind.js absent — le build n a pas enchaine l indexation"
            code=1
          else
            echo "OK : $(ls dist/pagefind | wc -l) entree(s) dans dist/pagefind"
          fi
          node scripts/journal-des-preuves.mjs --consigner index-de-recherche "$code"

      - name: Les verificateurs de sortie, en ligne de commande, sur le dist/ produit
        id: verificateurs-de-sortie
        if: always() && steps.installation.outcome == 'success'
        # REDONDANT AVEC LE BUILD ? Non, et c'est le point : le build ne les
        # exerce que TANT QU'ILS SONT BRANCHES dans `astro.config.mjs`. Retirer
        # une ligne de ce tableau rend le build vert sur une sortie fautive.
        # Ce pas lit la meme sortie par l'autre porte — celle de la recette — et
        # ne depend d'aucun cablage.
        #
        # LA LISTE NE S'ECRIT PLUS ICI (2026-08-11, tache b903aa06). Elle etait
        # ecrite en dur — six noms — quand `package.json` en exposait NEUF :
        # `verifier:cascade-titres` etait donc garde par son SEUL cablage, la
        # chose precise que ce pas existe pour ne pas supposer. Ajouter le nom
        # aurait ferme le cas et laisse la classe ouverte ; la liste se DERIVE
        # desormais de `package.json`, moins des exemptions nommees et justifiees
        # dans `apps/web/scripts/verificateurs-de-sortie.mjs`. Le `--pourquoi`
        # ci-dessous les imprime DANS CE JOURNAL : qui recompte « 9 contre 7 »
        # trouve la reponse la ou il recompte, pas dans un commentaire.
        #
        # ON NE S'ARRETE PAS AU PREMIER ROUGE : on veut la liste complete des
        # manquements en une execution, pas un jeu de piste. La boucle capture donc
        # le code au lieu de le jeter (`cv=0` puis `... || cv=$?`), et le trie.
        #
        # POURQUOI TRIER (2026-08-11, tache 794ad120 ; mode operatoire au §4 de
        # `docs/ci-incapacite-vs-anomalie.md` du depot prive). L'ancienne forme
        # `npm run ... || echec=1` JETAIT le code : un `1` (a juge, c'est rouge) et
        # un `2` (n'a PAS pu juger) devenaient le meme echec. Or les verificateurs
        # savent rendre `2`, et le seul lecteur automatique de cette distinction
        # etait precisement ce job, qui l'aplatissait. Aplatis, ils envoient
        # chercher dans le MAUVAIS OBJET : `1` = corriger le SITE, `2` = corriger
        # l'ENVIRONNEMENT.
        #
        # DEUX NOMS POUR DEUX CHOSES (reconciliation du 2026-08-12, tache b84acfc7).
        # `cv` est le code du VERIFICATEUR COURANT, reaffecte a chaque tour ; `code`
        # est le verdict DU PAS, celui que la consigne transmet au journal — meme
        # sens que dans les quatre autres pas qui jugent. Les confondre ferait
        # consigner le code du DERNIER verificateur au lieu du verdict du pas, et
        # aucun run vert ne le montrerait.
        #
        # CE PAS NE SORT PLUS SUR SON PROPRE CODE (tache 772ac0ac). Il consigne, et
        # le dernier pas du job tranche. Un `exit` ici ferait sauter les preuves
        # suivantes — c'est le defaut que ce `always()` et ce journal reparent. Le
        # verdict, lui, ne s'affaiblit pas : il GAGNE en precision, la consigne
        # distinguant desormais 2 de 1 la ou la boucle simple les aplatissait en 1.
        run: |
          code=0
          node scripts/verificateurs-de-sortie.mjs --pourquoi
          liste="$(node scripts/verificateurs-de-sortie.mjs)"
          if [ -z "$liste" ]; then
            # INCAPACITE et non anomalie : la derivation ne sait pas dire QUI doit
            # tourner. Rien n'a ete juge — le geste est de corriger le dispositif,
            # pas de chercher un defaut dans la sortie.
            echo "INCAPACITE : la derivation n a rendu AUCUN verificateur — la boucle serait verte sur rien"
            code=2
          else
            anomalies=""
            incapacites=""
            for v in $liste; do
              echo "::group::verifier:$v"
              # `set -e` EST ACTIF (le shell par defaut d'un `run:` est `bash -e {0}`).
              # Ecrire `npm run ...; cv=$?` avorterait le job AVANT l'affectation.
              # La forme `cv=0` puis `... || cv=$?` place la commande dans un
              # compound : `-e` ne se declenche pas, et `cv` est toujours defini.
              cv=0
              npm run --silent "verifier:$v" || cv=$?
              # `::endgroup::` AVANT le `case` : sinon la sortie du verificateur reste
              # repliee dans un groupe que le `::error::` ne rouvre pas.
              echo "::endgroup::"
              case "$cv" in
                0) ;;
                2) incapacites="$incapacites $v" ;;
                *) anomalies="$anomalies $v" ;;
              esac
            done

            if [ -n "$incapacites" ]; then
              echo "::error title=Verification impossible::N ONT PAS PU JUGER (code 2) :$incapacites"
              echo "N ONT PAS PU JUGER — code 2, il manquait de quoi juger. Corriger l ENVIRONNEMENT :$incapacites"
            fi
            if [ -n "$anomalies" ]; then
              echo "::error title=Anomalie::ONT JUGE ET TROUVE (code 1) :$anomalies"
              echo "ONT JUGE, ET TROUVE — code 1. Corriger le SITE :$anomalies"
            fi

            # LE VERDICT NE S'AFFAIBLIT PAS. Toute issue non nulle, incapacite
            # COMPRISE, fait rougir le job — par le journal, seul juge. L'incapacite
            # prime sur l'anomalie : quand un verificateur n'a pas pu juger, la
            # population est amputee, et « corriger l'ENVIRONNEMENT » passe avant.
            if [ -n "$incapacites" ]; then
              code=2
            elif [ -n "$anomalies" ]; then
              code=1
            else
              echo "OK : $(echo "$liste" | wc -w) verificateur(s), tous conformes (code 0)."
            fi
          fi
          node scripts/journal-des-preuves.mjs --consigner verificateurs-de-sortie "$code"

      - name: Bornes de pagination et bascule FR/EN, sur un second build reel
        id: preuve-pagination
        # `always()` : cette preuve construit SON PROPRE corpus dans `dist-recette/`.
        # Elle ne partage rien avec les pas ci-dessus, et rien ne justifiait qu'un
        # verificateur rouge sur `dist/` la fasse sauter.
        if: always() && steps.installation.outcome == 'success'
        # Corpus de recette (`scripts/corpus-recette.mjs`) : les bornes que le
        # corpus editorial n'atteint pas — page 2, categorie a exactement 12,
        # article non traduit. Sortie dans `dist-recette/`, jamais dans `dist/`.
        run: |
          code=0
          npm run preuve:pagination || code=$?
          node scripts/journal-des-preuves.mjs --consigner preuve:pagination "$code"

      - name: Le seuil de la garde des images OG separe encore les deux populations
        id: preuve-encre-og
        # `always()` : ce pas ne lit AUCUNE sortie construite. Il n'avait aucune
        # raison de dependre des quatre precedents, et c'est pourtant lui qui sautait
        # le plus souvent, etant le dernier de la file.
        if: always() && steps.installation.outcome == 'success'
        # Il rejoue les deux distributions (avec fontes, sans aucune fonte) et sort
        # en code non nul si le seuil cesse de tomber dans le fosse. Sur ce runner
        # il mesure EN PLUS que les fontes du pas ci-dessus sont bien resolues.
        run: |
          code=0
          npm run preuve:encre-og || code=$?
          node scripts/journal-des-preuves.mjs --consigner preuve:encre-og "$code"

      # LA SURCHARGE `partage.seo` N'EST PAS CÂBLÉE ICI, ET C'EST MESURÉ, PAS SUPPOSÉ.
      #
      # Elle l'a été le 2026-08-14, et la CI a rougi trois fois de suite : « 0 pages lues …
      # VERIFICATION IMPOSSIBLE ». La raison est structurelle et non réparable par un
      # déplacement de pas — `scripts/preuve-surcharge-seo.mjs` croise le CORPUS VERSIONNÉ
      # (40 articles) avec `dist/`, or le `dist/` de ce job est construit contre le Strapi de
      # SUBSTITUTION, qui sert 3 fixtures. Aucune page du corpus n'y est, donc rien à
      # confronter, donc `2` — et c'est le bon verdict : « je n'ai pas pu juger » ne doit
      # jamais se déguiser en vert.
      #
      # Elle est donc exposée en `recette:surcharge-seo`, sur le précédent exact de
      # `recette:pagination-corpus` — même dossier, même famille de fichier, un script qui se
      # lance À LA MAIN contre un `dist/` construit depuis l'instance réelle. La renommer
      # plutôt que la laisser rouge n'est pas un contournement : le test
      # `journal-des-preuves` offrait explicitement les deux issues, et c'est la mesure qui
      # a tranché entre elles.
      #
      # OÙ ELLE TOURNE DÉSORMAIS, ET POURQUOI PAS ICI (arbitrage du 2026-08-14, tâche
      # `b2682fc0`, session supervisée) : au BUILD DE PRODUCTION, déclaré par
      # `apps/web/nixpacks.toml`. C'est le seul endroit où ses deux sources sont réelles en
      # même temps — Coolify clone le dépôt, donc le corpus, et construit contre l'instance.
      #
      # Les deux autres branches ont été instruites, et écartées sur des faits :
      #   - un banc qui SERVIRAIT le corpus obligerait à réimplémenter le seed (relations,
      #     blocs, `localizations`, renommage des médias à l'upload). La preuve tournerait
      #     alors contre ce générateur, et cesserait de couvrir les deux maillons qui ont
      #     RÉELLEMENT cassé — le seed muet du 2026-08-12, le renommage du 2026-08-14 ;
      #   - « la déplacer dans le job de mesure » suppose un job qui n'existe pas : aucun
      #     workflow des deux dépôts ne porte de secret ni ne joint l'instance.
      #
      # Ce fichier reste donc inchangé sur ce point, et c'est le résultat de l'arbitrage,
      # pas son ajournement. Le détail vit en T-13 de `docs/arbitrages-techniques.md`
      # (dépôt privé).

      - name: La garde de surface publique sait encore rougir sur une fuite EN PROFONDEUR
        id: preuve-surface-profondeur
        # `always()` : ce pas ne lit AUCUNE sortie construite et ne joint AUCUN reseau —
        # il dresse son propre Strapi de substitution sur `127.0.0.1`. Il n'avait donc
        # aucune raison de dependre du build ni des verificateurs de `dist/`.
        if: always() && steps.installation.outcome == 'success'
        # Il joue le CLI reel contre deux etats du meme banc : une relation imbriquee a
        # `publishedAt: null` servie sans credence (la garde DOIT rendre 1 et nommer le
        # chemin), puis le meme banc protege (elle DOIT rendre 0). Sans lui, une
        # regression du parcours en profondeur laisserait la garde rendre 0 sur
        # l'instance reelle, qui est saine — un vert indiscernable du vert legitime.
        run: |
          code=0
          npm run preuve:surface-profondeur || code=$?
          node scripts/journal-des-preuves.mjs --consigner preuve:surface-profondeur "$code"

      - name: Le verdict du job — relu dans le journal, jamais dans le dernier pas
        # LE SEUL JUGE DU JOB. Chaque pas ci-dessus sort en 0 pour ne pas arreter la
        # file ; c'est ici que leurs codes sont relus, classes selon la convention de
        # `scripts/issues.mjs` (0 conforme, 1 corriger le SITE, 2 corriger
        # l'ENVIRONNEMENT) et agreges en un verdict unique.
        #
        # POURQUOI IL NE PEUT PAS ETRE VERT PAR ACCIDENT — c'est la question qu'il
        # faut se poser d'un dispositif qui differe des rouges. Trois parades, toutes
        # dans `scripts/journal-des-preuves.mjs` : un journal vide rend 2, une ligne
        # illisible rend 2, et un pas ATTENDU (derive des `preuve:*` de package.json,
        # plus les deux pas natifs declares) absent du journal rend 2. Un verdict
        # rendu sur une population amputee certifierait « tout conforme » sur ce qui
        # manque.
        if: always()
        run: node scripts/journal-des-preuves.mjs --verdict
