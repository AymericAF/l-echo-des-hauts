<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <rect width="1600" height="900" fill="#EFEBE3"/>
  <rect x="180" y="120" width="1240" height="700" fill="#FBFAF7" stroke="#1A1A1A" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="220" y="170" width="420" height="18" fill="#1F5C4A"/>
  <text x="220" y="230" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1A1A1A">Extract from the connection file — reconstruction</text>
  <text x="220" y="272" font-family="Georgia, serif" font-size="24" fill="#1A1A1A" opacity="0.65">Plateau substation — connection file lodged in 2024</text>
  <text x="236" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.55">Capacities, in megawatts</text>
  <line x1="220" y1="336" x2="1380" y2="336" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="2"/>
  <text x="236" y="386" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Substation hosting capacity, as sized</text>
  <text x="1364" y="386" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">22.0</text>
  <line x1="236" y1="402" x2="1380" y2="402" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <text x="236" y="438" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Reserved by two solar plants (2019, 2022) and a biogas unit</text>
  <text x="1364" y="438" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">- 13.6</text>
  <line x1="236" y1="454" x2="1380" y2="454" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <text x="236" y="490" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">RESIDUAL CAPACITY, AT THE LAST PUBLISHED STATE</text>
  <text x="1364" y="490" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#1F5C4A" opacity="1">8.4</text>
  <line x1="236" y1="506" x2="1380" y2="506" stroke="#1A1A1A" stroke-opacity="0.4" stroke-width="3"/>
  <text x="236" y="542" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Capacity requested by the farm — six turbines of 3.3 MW</text>
  <text x="1364" y="542" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">19.8</text>
  <line x1="236" y1="558" x2="1380" y2="558" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <text x="236" y="594" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Shortfall to cover</text>
  <text x="1364" y="594" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">11.4</text>
  <line x1="236" y1="610" x2="1380" y2="610" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
  <text x="236" y="700" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A" opacity="0.55">Substation reinforcement, priced in the same file</text>
  <text x="236" y="728" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Takes hosting capacity from 22 to 34 MW</text>
  <text x="1364" y="728" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">4,200,000 euros</text>
  <text x="236" y="764" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1A1A" opacity="0.8">Farm's share, in proportion to the capacity reserved</text>
  <text x="1364" y="764" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1A1A1A" opacity="1">95 %</text>
  <text x="236" y="806" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A1A" opacity="0.5">Document entirely reconstructed</text>
</svg>
